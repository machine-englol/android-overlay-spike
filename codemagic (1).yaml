              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.saturno.spike"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.saturno.spike"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1-spike"

                  ndk {
                      abiFilters += listOf("arm64-v8a")
